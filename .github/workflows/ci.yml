name: CI

on:
  push:
  pull_request:

jobs:
  solutions:
    name: Reference solutions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset solutions
      - name: Build
        run: cmake --build --preset solutions
      - name: Test
        run: ctest --preset solutions
